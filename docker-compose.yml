
services:

  db:
    image: mysql:8.0
    container_name: nba_ecommerce_db
    restart: always

    environment:
      MYSQL_DATABASE: nba_ecommerce
      MYSQL_USER: nba_user
      MYSQL_PASSWORD: nba_password
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    container_name: nba_ecommerce_backend
    restart: always

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/nba_ecommerce?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: nba_user
      SPRING_DATASOURCE_PASSWORD: nba_password

      # Carpeta donde Spring Boot guarda las imágenes
      APP_UPLOAD_DIR: /app/uploads

    volumes:
      # Guardar imágenes fuera del contenedor
      - ./uploads:/app/uploads

    depends_on:
      - db

volumes:
  db_data:
