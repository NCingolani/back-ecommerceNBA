version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nba_ecommerce_db
    restart: always
    environment:
      MYSQL_DATABASE: nba_ecommerce
      MYSQL_USER: nba_user
      MYSQL_PASSWORD: nba_password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
